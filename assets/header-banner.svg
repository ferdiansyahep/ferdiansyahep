<svg fill="none" viewBox="0 0 900 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .wave {
      animation: waveMove 10s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="150" y1="0" x2="150" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
    <line x1="450" y1="0" x2="450" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="750" y1="0" x2="750" y2="220" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="800" cy="50" r="90" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="180" r="70" fill="#818cf8" opacity="0.12" filter="url(#glow)" />

  <!-- Flowing Wave Vectors -->
  <path d="M 0,160 Q 220,130 450,170 T 900,150 L 900,220 L 0,220 Z" fill="#0369a1" opacity="0.25" />
  <path d="M 0,180 Q 250,150 500,190 T 900,175 L 900,220 L 0,220 Z" fill="#0284c7" opacity="0.35" />
  <path d="M 0,195 Q 200,170 450,200 T 900,190 L 900,220 L 0,220 Z" fill="#38bdf8" opacity="0.2" />

  <!-- Floating Badge Pill -->
  <g transform="translate(450, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <text x="0" y="4" text-anchor="middle" class="badge-text">⚡ FULL-STACK &amp; AGENTIC AI</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="115" text-anchor="middle" class="title">Ferdiansyah Eka Putra</text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" class="subtitle">Information Systems Graduate (S.Kom) • Web Developer • Cloud &amp; AI Explorer</text>
</svg>
