name: generate animation

on:
  # Jalankan otomatis setiap 24 jam sekali
  schedule:
    - cron: "0 0 * * *"

  # Memungkinkan kamu menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

  # Jalankan setiap kali ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate GitHub Activity Graph
        run: |
          python3 scripts/generate_activity_graph.py
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-activity.svg
          git commit -m "Update GitHub Activity SVG [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No push required"

      # Generasi animasi ular dari grafik kontribusi
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0284c7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      # Push file hasil (SVG) ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
